<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Hero background</title>
  <desc id="description">Gradient background with stadium-inspired lines.</desc>
  <defs>
    <linearGradient id="heroGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8F1FC"/>
      <stop offset="45%" stop-color="#D3E6FB"/>
      <stop offset="100%" stop-color="#B9D5F9"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#89b2e0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#2d5b8a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#heroGradient)" />
  <circle cx="600" cy="337" r="266" fill="white" opacity="0.08" />
  <g fill="none" stroke="white" stroke-width="20" opacity="0.18">
    <ellipse cx="600" cy="345" rx="420" ry="145" />
    <ellipse cx="600" cy="345" rx="520" ry="180" />
    <ellipse cx="600" cy="345" rx="620" ry="215" />
  </g>
  <g fill="none" stroke="white" stroke-width="12" opacity="0.12">
    <path d="M140 120 C260 70, 430 80, 560 160" />
    <path d="M1060 120 C940 70, 770 80, 640 160" />
    <path d="M140 560 C260 615, 430 605, 560 525" />
    <path d="M1060 560 C940 615, 770 605, 640 525" />
  </g>
  <rect x="0" y="525" width="1200" height="120" fill="url(#accentGradient)" opacity="0.35" />
</svg>
