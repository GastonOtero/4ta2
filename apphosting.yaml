# This file configures the Firebase App Hosting backend.

# Specifies the entry point for your server.
# App Hosting will run this command to start your application.
entryPoint: node dist-server/server.js

# Defines the runtime environment.
# 'nodejs20' is a stable and recommended version.
runtime: nodejs20

# This section is crucial for managing environment variables and secrets.
env:
  # This entry maps the 'FAL_KEY' environment variable in your application
  # to the 'FAL_KEY' secret stored in Google Cloud Secret Manager.
  - variable: FAL_KEY
    secret: FAL_KEY
